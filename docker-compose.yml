services:
  api:
    build: .
    container_name: taskly-api
    restart: unless-stopped
    command: npm start
    env_file: .env
    environment:
      DATABASE_URL: postgresql://taskly:taskly@postgres:5432/taskly
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  websocket:
    build: .
    container_name: taskly-websocket
    restart: unless-stopped
    command: npm run websocket
    env_file: .env
    environment:
      WS_PORT: 3001
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"

  task-worker:
    build: .
    container_name: taskly-task-worker
    restart: unless-stopped
    command: npm run task_worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://taskly:taskly@postgres:5432/taskly
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  export-worker:
    build: .
    container_name: taskly-export-worker
    restart: unless-stopped
    command: npm run export_worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://taskly:taskly@postgres:5432/taskly
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: taskly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskly
      POSTGRES_PASSWORD: taskly
      POSTGRES_DB: taskly
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskly -d taskly"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8
    container_name: taskly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
  minio:
    image: quay.io/minio/minio:latest
    container_name: taskly-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: taskly
      MINIO_ROOT_PASSWORD: tasklyminio
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data
volumes:
  minio_data:
  postgres_data:
  redis_data:
